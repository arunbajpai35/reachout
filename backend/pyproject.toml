[project]
name = "reverse-recruit"
version = "0.1.0"
description = "AI reverse job hunting copilot for Indian engineers"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    # Settings & validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # DB
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # Queue & cache
    "redis>=5.2",
    "arq>=0.26",
    # External
    "openai>=1.55",
    "httpx>=0.27",
    "apify-client>=1.8",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pdfplumber>=0.11",
    # Reliability & observability
    "tenacity>=9.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# E501: line length is enforced by formatter, not linter.
# B008: FastAPI uses `arg: T = Depends(...) / File(...)` as the idiomatic DI pattern;
#       Ruff flags it because calling a function in a default arg is normally a bug.
ignore = ["E501", "B008"]
